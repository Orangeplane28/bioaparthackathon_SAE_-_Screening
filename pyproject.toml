[project]
name = "alxbio-esm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.11.0",
    "transformers>=4.48",
    "scikit-learn>=1.6",
    "umap-learn>=0.5",
    "matplotlib>=3.10",
    "requests>=2.32",
    "accelerate>=1.7",
    "esm>=3.2.3",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alxbio_esm"]
